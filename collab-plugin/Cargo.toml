[package]
name = "markdown-preview-collab"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots", "url"] }
url = "2.5.8"
