<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Preview</title>
  </head>
  <body>
    <header id="toolbar">
      <span id="toolbar-status" class="toolbar-status" role="status" aria-live="polite"></span>
      <button id="path-display" class="path-display" title="クリックでパスをコピー (Ctrl+Shift+C)" hidden></button>
      <span class="spacer"></span>
      <button id="btn-files" title="ファイルパネル (Ctrl+B)" hidden>ファイル</button>
      <button id="zoom-label" class="zoom-label" title="ズーム（Ctrl+ホイール / Ctrl+＋− / クリックで 100%）">100%</button>
      <div class="segmented" role="group" aria-label="表示モード">
        <button data-mode="editor" title="エディタのみ (Ctrl+1)">編集</button>
        <button data-mode="split" title="分割 (Ctrl+2)">分割</button>
        <button data-mode="preview" title="プレビューのみ (Ctrl+3)">プレビュー</button>
      </div>
    </header>
    <nav id="tabs" role="tablist" aria-label="開いているファイル"></nav>
    <div id="banner" class="banner" hidden>
      <span>ファイルが外部で変更されました。編集中の内容は未保存です。</span>
      <button id="banner-reload">再読み込み</button>
      <button id="banner-ignore">無視</button>
    </div>
    <div id="update-banner" class="banner update" hidden>
      <span id="update-text"></span>
      <span id="update-progress" class="update-progress"></span>
      <button id="update-install" class="primary">更新して再起動</button>
      <button id="update-manual" hidden>手動でダウンロード</button>
      <button id="update-notes">変更内容</button>
      <button id="update-later">後で</button>
    </div>
    <div id="workspace">
      <main id="main" data-mode="preview">
        <section id="editor-pane"></section>
        <div id="divider" role="separator" aria-orientation="vertical"></div>
        <section id="preview-pane">
          <article id="preview" class="markdown-body"></article>
        </section>
      </main>
      <div id="files-divider" role="separator" aria-orientation="vertical" hidden></div>
      <aside id="files" aria-label="ファイルパネル" hidden>
        <div class="files-head">
          <span id="files-root" class="files-root"></span>
          <button id="files-pick" title="作業フォルダを選ぶ…">選ぶ…</button>
          <button id="files-refresh" title="最新の状態に更新">⟳</button>
        </div>
        <div id="files-tree" role="tree" aria-label="作業フォルダ" tabindex="0"></div>
        <div id="files-status" class="files-status" hidden></div>
        <section id="files-recent" class="files-recent" aria-labelledby="files-recent-title" hidden>
          <h4 id="files-recent-title">最近使ったファイル</h4>
          <div id="files-recent-list" role="list"></div>
        </section>
      </aside>
    </div>
    <div id="files-menu" class="files-menu" role="menu" hidden>
      <button data-action="copy" role="menuitem">パスをコピー</button>
      <button data-action="reveal" role="menuitem">エクスプローラーで表示</button>
    </div>
    <div id="pdf-preview" class="pdf-preview" hidden>
      <div class="pdf-bar">
        <strong>PDF プレビュー</strong>
        <span class="pdf-hint">内容を確認して「保存」。印刷はビューアの印刷ボタンから</span>
        <button id="pdf-save" class="primary">保存…</button>
        <button id="pdf-close" title="閉じる (Esc)">閉じる</button>
      </div>
      <iframe id="pdf-frame" title="PDF プレビュー"></iframe>
    </div>
    <div id="settings" class="settings" hidden>
      <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-head">
          <strong id="settings-title">設定</strong>
          <button id="settings-close" title="閉じる (Esc)">閉じる</button>
        </div>
        <section class="settings-section">
          <h3>表示</h3>
          <label class="settings-row">
            <span class="grow">テーマ</span>
            <select id="set-theme">
              <option value="system">自動</option>
              <option value="light">ライト</option>
              <option value="dark">ダーク</option>
            </select>
          </label>
          <label class="settings-row" title="オフにすると、ツールバーのボタン・メニューと Ctrl+B も使えなくなります"><input id="set-files" type="checkbox" /> ファイルパネルを使う</label>
          <label class="settings-row" title="ファイルパネルの下部に出す件数。0 にすると一覧を出しません">
            <span class="grow">最近使ったフォルダの表示件数</span>
            <input id="set-recent-count" type="number" min="0" max="20" step="1" />
          </label>
        </section>
        <section class="settings-section">
          <h3>編集</h3>
          <div class="settings-row">
            <label class="grow"><input id="active-line" type="checkbox" /> プレビューで編集位置を色付け</label>
            <input id="active-line-color" type="color" title="色付けの色" />
            <button id="active-line-reset" title="既定の色に戻す">既定</button>
          </div>
          <label class="settings-row" title="オフにすると、エディタの一番上の行に合わせてスクロールします"><input id="follow-cursor" type="checkbox" /> 分割表示でプレビューをカーソルの位置に合わせる</label>
          <label class="settings-row" title="Tera Term と同じ操作。マウスで選んだ文字をすぐコピーし、エディタの右クリックでカーソル位置に貼り付けます"><input id="select-copy" type="checkbox" /> 選択で自動コピー・右クリックで貼り付け</label>
        </section>
        <section class="settings-section">
          <h3>更新</h3>
          <div class="settings-row">
            <span id="app-version" class="grow version">Markdown Preview</span>
          </div>
          <label class="settings-row"><input id="auto-update" type="checkbox" /> 起動時に自動で更新を確認</label>
          <label class="settings-row" title="オフにすると、更新前に未保存の変更を破棄するか確認します"><input id="keep-draft" type="checkbox" /> 更新時、未保存の変更を再起動後に復元</label>
        </section>
      </div>
    </div>
    <div id="preview-menu" class="files-menu" role="menu" hidden>
      <button data-action="view" role="menuitem" title="ウィンドウいっぱいに出して拡大縮小・移動しながら見る（クリックでも開く）">拡大して見る</button>
      <button data-action="annotate" role="menuitem" title="矢印・テキスト・枠・番号を画像に重ねる (Ctrl+Shift+A)">注釈を編集…</button>
    </div>
    <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="拡大ビューア" hidden>
      <div id="viewer-stage" class="viewer-stage"></div>
      <div class="viewer-bar">
        <span class="viewer-hint">ホイールで拡大縮小・ドラッグで移動・0 で全体・1 で実寸</span>
        <span id="viewer-zoom" class="viewer-zoom">100%</span>
        <button id="viewer-close" title="閉じる (Esc)">×</button>
      </div>
    </div>
    <div id="open-path" class="quick-input" hidden>
      <div class="quick-input-panel" role="dialog" aria-label="パスで開く">
        <input id="open-path-input" type="text" spellcheck="false" autocomplete="off" placeholder="ファイルかフォルダのパス（Enter で開く / Esc で閉じる）" />
        <div id="open-path-error" class="quick-input-error" hidden></div>
      </div>
    </div>
    <div id="dropzone" hidden><div>ここにドロップして開く</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
