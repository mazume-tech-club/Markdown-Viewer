<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ヘルプ - Markdown Preview</title>
  </head>
  <body class="help">
    <aside id="sidebar">
      <input id="search" type="search" placeholder="検索（例: 表 / シーケンス / C4）" autocomplete="off" />
      <nav id="toc"></nav>
      <div class="about">
        <div class="about-row">
          <span id="app-version" class="version">Markdown Preview</span>
          <button id="btn-check-update" title="GitHub の最新リリースを確認">更新を確認</button>
        </div>
        <label class="about-row"><input id="auto-update" type="checkbox" /> 起動時に自動で更新を確認</label>
      </div>
      <p class="hint">Esc で閉じる ・ Ctrl+F で検索</p>
    </aside>
    <main id="content"></main>
    <script type="module" src="/src/help.ts"></script>
  </body>
</html>
